[workspace]
resolver = "3"
members = ["crates/whisker-core", "crates/whisker-web", "crates/whisker-mcp", "crates/whisker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
whisker-core = { path = "crates/whisker-core" }
whisker-web = { path = "crates/whisker-web" }
whisker-mcp = { path = "crates/whisker-mcp" }

axum = "=0.8.9"
veer = { version = "=0.3.0", features = ["embed", "csrf", "ts"] }
ts-rs = "=12.0.1"
rust-embed = { version = "=8.13.0", features = ["debug-embed"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
getrandom = "=0.4.3"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
