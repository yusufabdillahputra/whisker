[workspace]
resolver = "3"
members = ["crates/whisker-core", "crates/whisker-web", "crates/whisker-mcp", "crates/whisker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
whisker-core = { path = "crates/whisker-core" }
whisker-web = { path = "crates/whisker-web" }
whisker-mcp = { path = "crates/whisker-mcp" }

axum = "=0.8.9"
veer = { version = "=0.3.0", features = ["embed", "csrf", "ts"] }
ts-rs = "=12.0.1"
rust-embed = { version = "=8.13.0", features = ["debug-embed"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
getrandom = "=0.4.3"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
# ADR-007: driver + migration + tes integrasi. TLS rustls (Neon butuh sslmode=require).
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "time"] }

# Task 04: primitif auth (Argon2id, PAT whk_, id sesi). Pin eksak.
argon2 = "=0.6.0"
sha2 = "=0.11.1"
crc32fast = "=1.5.2"
base64 = "=0.23.1"
subtle = "=2.6.1"

# Task 05: nilai domain bersama (slug NFKD, default avatar dari UUID).
unicode-normalization = "=0.1.26"
uuid = "=1.28.0"

# Task 06: kolom timestamptz repositori user (asumsi Q23: crate `time`).
time = "=0.3.55"

# Task 09: endpoint MCP stateless (ADR-011). Fitur klien hanya di dev-dependencies whisker-mcp.
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
schemars = { version = "=1.2.3", features = ["uuid1"] }
http = "=1.5.0"
# Klien HTTP mentah untuk tes kontrak `/mcp` (versi sama dengan yang ditarik rmcp).
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
