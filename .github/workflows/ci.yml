name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.0"
  NODE_VERSION: "24"
  SQLX_CLI_VERSION: "0.9.0"
  # Makro `query!` memakai metadata `.sqlx/` ter-commit, bukan DB saat compile (ADR-007).
  # `cargo sqlx prepare --check` tetap memeriksa ke DB (ia menyetel SQLX_OFFLINE=false sendiri).
  SQLX_OFFLINE: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Pasang toolchain Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --no-self-update && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pasang dependensi frontend
        run: npm --prefix frontend ci
      # build.rs crate whisker gagal bila frontend/dist tidak ada.
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Typecheck frontend
        run: npm --prefix frontend run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        # Kredensial uji non-rahasia, hanya untuk service CI sekali pakai.
        env:
          POSTGRES_USER: whisker
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: db-whisker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whisker -d db-whisker"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # `#[sqlx::test]` membuat database sementara per tes di server ini (user butuh CREATEDB).
      DATABASE_URL: postgres://whisker:ci@127.0.0.1:5432/db-whisker
    steps:
      - uses: actions/checkout@v7
      - name: Pasang toolchain Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pasang dependensi frontend
        run: npm --prefix frontend ci
      - name: Build frontend
        run: npm --prefix frontend run build
      # Biner ~/.cargo/bin ikut di-cache rust-cache; `cargo install` versi sama = no-op.
      - name: Pasang sqlx-cli
        run: cargo install sqlx-cli --version "$SQLX_CLI_VERSION" --locked --no-default-features --features postgres,rustls
      # Query `.sqlx/` merujuk `_sqlx_migrations`, jadi DB uji harus sudah ter-migrate.
      - name: Migrate DB uji
        run: cargo sqlx migrate run --source migrations
      - name: cargo sqlx prepare --check
        run: cargo sqlx prepare --workspace --check
      - name: Tes unit frontend (vitest)
        run: npm --prefix frontend test
      - name: cargo test
        run: cargo test --workspace
      # ts-rs menulis ulang type TS saat test; hasilnya harus identik dengan yang ter-commit.
      - name: Type TS ter-generate tidak berubah
        run: git diff --exit-code frontend/src/types/generated

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        # Kredensial uji non-rahasia, hanya untuk service CI sekali pakai.
        env:
          POSTGRES_USER: whisker
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: db-whisker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whisker -d db-whisker"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Nilai non-rahasia; biner menjalankan migration saat startup ke service di atas.
      DATABASE_URL: postgres://whisker:ci@127.0.0.1:5432/db-whisker
      WHISKER_PUBLIC_URL: http://127.0.0.1:8080
      WHISKER_HTTP_ADDR: 127.0.0.1:8080
      E2E_BASE_URL: http://127.0.0.1:8080
      # DB CI kosong: bootstrap admin (Task 06) gagal cepat tanpa env ini (K5). Nilai uji non-rahasia.
      WHISKER_ADMIN_EMAIL: e2e-admin@example.com
      WHISKER_ADMIN_PASSWORD: ci-e2e-admin-password
    steps:
      - uses: actions/checkout@v7
      - name: Pasang toolchain Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            test/playwright/package-lock.json
      - name: Pasang dependensi frontend
        run: npm --prefix frontend ci
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Build binary release
        run: cargo build --release -p whisker
      - name: Pasang dependensi Playwright
        run: npm --prefix test/playwright ci
      - name: Pasang Chromium
        working-directory: test/playwright
        run: npx playwright install --with-deps chromium
      - name: Tulis .e2e.env
        run: echo "E2E_BASE_URL=${E2E_BASE_URL}" > test/playwright/.e2e.env
      - name: Jalankan monolith di background
        run: |
          ./target/release/whisker > whisker.log 2>&1 &
          echo $! > whisker.pid
          for i in $(seq 1 60); do
            if ./target/release/whisker healthcheck 2>/dev/null; then echo "/health sehat"; exit 0; fi
            sleep 1
          done
          echo "monolith tidak sehat dalam 60 detik"; cat whisker.log; exit 1
      - name: Jalankan Playwright
        working-directory: test/playwright
        run: npx playwright test
      - name: Log monolith (saat gagal)
        if: failure()
        run: cat whisker.log || true
      - name: Unggah laporan Playwright (saat gagal)
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            test/playwright/playwright-report
            test/playwright/test-results
          retention-days: 3
          if-no-files-found: ignore
